theme: minima
title: SwiftTag GitHub Pages
description: SwiftTag project information, links, blog, etc.
author: Chris McCready

extra_nav_links:
  - title: "Project Analysis"
    url: /Docs/Analysis/output/index.html
  - title: "User Documentation"
    url: /Docs/UserDocumentation/index.html

exclude:
  - BuildScripts/
  - Docs/AppleDocsIndex/
  - Docs/Guides/
  - Docs/Plans/
  - Docs/Analysis/config/
  - Docs/Analysis/output/review-packets/
  - Docs/Analysis/tests/
  - Docs/Analysis/.gitignore
  - Docs/Analysis/analyze_swifttag_project.py
  - Docs/Analysis/render_plotly_commit_history.py
  - Docs/testing-tools-review.md
  - SwiftTag.xcodeproj/
  - SwiftTag/
  - SwiftTagAppleScriptTests/
  - SwiftTagQuickLookPreview/
  - SwiftTagTestFiles/
  - SwiftTagTests/
  - SwiftTagUITests/
  - ThirdParty/
  - AGENTS.md
  - LICENSE
  - SwiftTag-Bridging-Header.h
  - SwiftTag.xctestplan
  - .gitignore

defaults:
  - scope:
      path: "Docs/README.md"
    values:
      layout: default
      title: "Project README"
  - scope:
      path: "Docs/Analysis/README.md"
    values:
      layout: default
      title: "Project Analysis README"
